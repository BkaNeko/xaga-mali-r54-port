#############################################
#           init.insmod.cfg                 #
# This file contains kernel modules to load #
# at init time by init.insmod.sh script     #
#############################################

# Load kernel modules here, add your KO behind
modprobe|*

# GPU stack, explicit dependency order.
# modprobe resolves deps through modules.dep; these lines are a fallback
# because that resolution leaves mali_kbase unloaded on some builds.
# Repeating the list twice covers forward references in the chain.
insmod|/vendor_dlkm/lib/modules/mtk-mbox.ko
insmod|/vendor_dlkm/lib/modules/mtk_rpmsg_mbox.ko
insmod|/vendor_dlkm/lib/modules/mtk_tinysys_ipi.ko
